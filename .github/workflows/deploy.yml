name: Deploy

# Builds the static site and uploads out/ to the cPanel webroot over FTPS,
# the same way the Brandscapes site deploys to this server.
#
# Runs on every push to main, so a merged PR deploys itself. It can also be
# run by hand from Actions → Deploy → Run workflow, where it is a dry run
# unless dry_run is set to false.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_HOST      bh-20.webhostbox.net — the hostname, not the IP: the
#                 server's certificate is for *.webhostbox.net
#   FTP_USER      an FTP account whose home directory is vedicgurukul.com's
#                 document root (cPanel → FTP Accounts)
#   FTP_PASSWORD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_dir:
        description: Folder to upload into, relative to where the FTP login lands. ./ is that folder itself.
        required: false
        default: ./
      dry_run:
        description: true = connect and list what would change, upload nothing. Use for the first run.
        required: false
        default: "true"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Check the build before shipping it
        run: |
          for f in index.html hi/index.html gu/index.html 404.html .htaccess sitemap.xml robots.txt documents/Dinacharya.pdf; do
            test -s "out/$f" || { echo "::error::out/$f is missing"; exit 1; }
          done
          if grep -rl "gurukul.joisher.com" out --include='*.html' --include='*.xml' --include='*.txt'; then
            echo "::error::The build still points at the old domain"; exit 1
          fi
          grep -q 'https://vedicgurukul.com/' out/sitemap.xml
          du -sh out

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ./out/
          server-dir: ${{ github.event.inputs.server_dir || './' }}
          dangerous-clean-slate: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false' }}
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      # DNS may not point at the server yet, so ask the server directly for
      # vedicgurukul.com by its Host header rather than going through DNS.
      - name: Verify the deployed site on the server
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          ip=$(getent ahostsv4 "$FTP_HOST" | awk 'NR==1{print $1}')
          echo "Server IP: $ip"
          fail=0
          for path in / /hi/ /gu/ /images/og.jpg /videos/stem-1.mp4 /documents/Dinacharya.pdf; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H 'Host: vedicgurukul.com' "http://$ip$path")
            echo "$code $path"
            [ "$code" = 200 ] || fail=1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H 'Host: vedicgurukul.com' "http://$ip/.ftp-deploy-sync-state.json")
          echo "$code /.ftp-deploy-sync-state.json (must not be 200)"
          [ "$code" != 200 ] || fail=1
          exit $fail
