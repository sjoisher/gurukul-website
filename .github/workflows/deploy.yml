name: Deploy

# Builds the static site and uploads out/ to the cPanel webroot over FTPS,
# the same way the Brandscapes site deploys to this server.
#
# Runs on every push to main, so a merged PR deploys itself. It can also be
# run by hand from Actions → Deploy → Run workflow, where it is a dry run
# unless dry_run is set to false.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_HOST      bh-20.webhostbox.net — the hostname, not the IP: the
#                 server's certificate is for *.webhostbox.net
#   FTP_USER      an FTP account whose home directory is vaidikgurukul.org's
#                 document root (cPanel → FTP Accounts)
#   FTP_PASSWORD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_dir:
        description: Folder to upload into, relative to where the FTP login lands. ./ is that folder itself.
        required: false
        default: ./
      dry_run:
        description: true = connect and list what would change, upload nothing. Use for the first run.
        required: false
        default: "true"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Fail in one clear line if a secret is missing, before spending time on
      # the build. Prints names only; values are never echoed.
      - name: Check the FTP secrets are available
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for name in FTP_HOST FTP_USER FTP_PASSWORD; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "::error::$name is empty or not visible to this workflow. Add it under Settings → Secrets and variables → Actions → Repository secrets."; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Check the build before shipping it
        run: |
          for f in index.html hi/index.html gu/index.html 404.html .htaccess sitemap.xml robots.txt documents/Dinacharya.pdf admin/index.html admin/config.yml; do
            test -s "out/$f" || { echo "::error::out/$f is missing"; exit 1; }
          done
          if grep -rlE "gurukul\.joisher\.com|vedicgurukul\.com" out --include='*.html' --include='*.xml' --include='*.txt'; then
            echo "::error::The build still points at an old domain"; exit 1
          fi
          grep -q 'https://vaidikgurukul.org/' out/sitemap.xml
          ls out/images/generated/*-600.jpg >/dev/null || { echo "::error::No web-sized photos in out/images/generated"; exit 1; }
          if [ -d out/photos ]; then echo "::error::Original photos ended up in the build"; exit 1; fi
          du -sh out

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ./out/
          server-dir: ${{ github.event.inputs.server_dir || './' }}
          dangerous-clean-slate: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false' }}
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      # DNS may not point at the server yet, so ask the server directly for
      # vaidikgurukul.org rather than going through DNS. SITE_IP is the cPanel
      # account's shared IP (cPanel → General Information → Shared IP
      # Address); the server's main IP, which FTP_HOST resolves to, is tried
      # too, over HTTP and HTTPS. Each page must contain its own text: the
      # hosting provider answers 200 with an error page for domains it is not
      # (yet) serving.
      - name: Verify the deployed site on the server
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
        env:
          SITE_IP: 199.79.63.251
          HOST: vaidikgurukul.org
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          main_ip=$(getent ahostsv4 "$FTP_HOST" | awk 'NR==1{print $1}')
          # get <scheme> <ip> <path> <outfile>
          get() {
            port=80; [ "$1" = https ] && port=443
            rm -f "$4"; : > "$4"
            # Never let a failed or timed-out request abort the step (the shell runs with -e).
            curl -sk --connect-timeout 10 --max-time 60 -A "Mozilla/5.0 (deploy check)" --resolve "$HOST:$port:$2" \
              -o "$4" -w '%{http_code} %{content_type} %{size_download}B -> %{redirect_url}' "$1://$HOST$3" || true
          }
          show() { echo "      body: $(head -c 400 "$1" | tr '\n\r\t' '   ')"; }

          # 1. Find a route on which the server serves the Gurukul home page.
          route=""; provider_error=0
          for ip in "$SITE_IP" "$main_ip"; do
            for scheme in http https; do
              probe="/tmp/probe-$scheme-$ip"
              res=$(get "$scheme" "$ip" / "$probe")
              if grep -q "Sant Shri Odhavram Vaidic Gurukul" "$probe"; then
                echo "ok    $scheme via $ip serves the site ($res)"
                [ -z "$route" ] && route="$scheme $ip"
              else
                echo "--    $scheme via $ip: not the site ($res)"
                grep -q "Page cannot be displayed" "$probe" && provider_error=1
              fi
            done
          done

          if [ -z "$route" ]; then
            if [ "$provider_error" = 1 ]; then
              echo "::warning::Files uploaded, but the web server is not serving vaidikgurukul.org yet: it answers with the hosting provider's 'Page cannot be displayed' page. This is expected until the domain's DNS points at $SITE_IP; if DNS already does, ask the host to check the domain's web server configuration."
              exit 0
            fi
            echo "::error::No route served the Gurukul home page. What http via $SITE_IP returned:"; show "/tmp/probe-http-$SITE_IP"; exit 1
          fi

          # 2. Full checks on the working route.
          set -- $route; scheme=$1; ip=$2; fail=0
          while IFS='|' read -r path marker; do
            res=$(get "$scheme" "$ip" "$path" /tmp/page)
            if [ "${res%% *}" = 200 ] && grep -q "$marker" /tmp/page; then echo "ok    $path  ($res)"
            else echo "::error::$path did not return the Gurukul page ($res)"; show /tmp/page; fail=1; fi
          done <<'PAGES'
          /hi/|संत श्री ओधवराम वैदिक गुरुकुल
          /gu/|સંત શ્રી ઓધવરામ વૈદિક ગુરુકુલ
          /admin/|sveltia-cms.js
          PAGES

          while IFS='|' read -r path type; do
            res=$(get "$scheme" "$ip" "$path" /tmp/file)
            case "$res" in
              "200 $type"*) echo "ok    $path  ($res)" ;;
              *) echo "::error::$path: expected 200 $type, got $res"; show /tmp/file; fail=1 ;;
            esac
          done <<'FILES'
          /images/og.jpg|image/jpeg
          /images/logo.png|image/png
          /videos/stem-1.mp4|video/mp4
          /documents/Dinacharya.pdf|application/pdf
          /sitemap.xml|application/xml
          FILES

          res=$(get "$scheme" "$ip" /.ftp-deploy-sync-state.json /tmp/file)
          if [ "${res%% *}" = 200 ]; then echo "::error::/.ftp-deploy-sync-state.json is publicly readable ($res), so .htaccess is not in effect"; fail=1
          else echo "ok    /.ftp-deploy-sync-state.json blocked ($res)"; fi

          res=$(get "$scheme" "$ip" /this-page-does-not-exist/ /tmp/file)
          [ "${res%% *}" = 404 ] && echo "ok    unknown path returns 404" || { echo "::error::unknown path returned $res, expected 404"; fail=1; }

          exit $fail
