name: Deploy

# Builds the static site and uploads out/ to the cPanel webroot over FTPS,
# the same way the Brandscapes site deploys to this server.
#
# Runs on every push to main, so a merged PR deploys itself. It can also be
# run by hand from Actions → Deploy → Run workflow, where it is a dry run
# unless dry_run is set to false.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_HOST      bh-20.webhostbox.net — the hostname, not the IP: the
#                 server's certificate is for *.webhostbox.net
#   FTP_USER      an FTP account whose home directory is vedicgurukul.com's
#                 document root (cPanel → FTP Accounts)
#   FTP_PASSWORD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_dir:
        description: Folder to upload into, relative to where the FTP login lands. ./ is that folder itself.
        required: false
        default: ./
      dry_run:
        description: true = connect and list what would change, upload nothing. Use for the first run.
        required: false
        default: "true"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Fail in one clear line if a secret is missing, before spending time on
      # the build. Prints names only; values are never echoed.
      - name: Check the FTP secrets are available
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for name in FTP_HOST FTP_USER FTP_PASSWORD; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "::error::$name is empty or not visible to this workflow. Add it under Settings → Secrets and variables → Actions → Repository secrets."; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Check the build before shipping it
        run: |
          for f in index.html hi/index.html gu/index.html 404.html .htaccess sitemap.xml robots.txt documents/Dinacharya.pdf; do
            test -s "out/$f" || { echo "::error::out/$f is missing"; exit 1; }
          done
          if grep -rl "gurukul.joisher.com" out --include='*.html' --include='*.xml' --include='*.txt'; then
            echo "::error::The build still points at the old domain"; exit 1
          fi
          grep -q 'https://vedicgurukul.com/' out/sitemap.xml
          du -sh out

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ./out/
          server-dir: ${{ github.event.inputs.server_dir || './' }}
          dangerous-clean-slate: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false' }}
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      # DNS may not point at the server yet, so ask the server directly for
      # vedicgurukul.com by its Host header. SITE_IP is the cPanel account's
      # shared IP (cPanel → General Information → Shared IP Address), which is
      # not the same as the server's main IP that FTP_HOST resolves to: asking
      # the main IP returns the server's default page, which answers 200 for
      # almost anything. So each page is also checked for its own text.
      - name: Verify the deployed site on the server
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
        env:
          SITE_IP: 199.79.63.251
          HOST: vedicgurukul.com
        run: |
          fail=0
          get() { curl -s --max-time 30 -H "Host: $HOST" -A "Mozilla/5.0 (deploy check)" -o "$2" -w '%{http_code} %{content_type} %{size_download}B -> %{redirect_url}' "http://$SITE_IP$1"; }
          # On a mismatch, show what the server actually sent (first 400 bytes, one line).
          show() { echo "      body: $(head -c 400 "$1" | tr '\n\r\t' '   ')"; }

          # path | text the page must contain
          while IFS='|' read -r path marker; do
            res=$(get "$path" /tmp/page)
            if [ "${res%% *}" = 200 ] && grep -q "$marker" /tmp/page; then
              echo "ok    $path  ($res)"
            else
              echo "::error::$path did not return the Gurukul page ($res). Title: $(grep -o '<title>[^<]*' /tmp/page | head -1)"
              show /tmp/page
              fail=1
            fi
          done <<'PAGES'
          /|Sant Shri Odhavram Vaidic Gurukul
          /hi/|संत श्री ओधवराम वैदिक गुरुकुल
          /gu/|સંત શ્રી ઓધવરામ વૈદિક ગુરુકુલ
          PAGES

          # path | expected content type prefix
          while IFS='|' read -r path type; do
            res=$(get "$path" /tmp/file)
            case "$res" in
              "200 $type"*) echo "ok    $path  ($res)" ;;
              *) echo "::error::$path: expected 200 $type, got $res"; show /tmp/file; fail=1 ;;
            esac
          done <<'FILES'
          /images/og.jpg|image/jpeg
          /images/gallery/1-sm.jpg|image/jpeg
          /videos/stem-1.mp4|video/mp4
          /documents/Dinacharya.pdf|application/pdf
          /sitemap.xml|application/xml
          FILES

          res=$(get /.ftp-deploy-sync-state.json /tmp/file)
          if [ "${res%% *}" = 200 ]; then
            echo "::error::/.ftp-deploy-sync-state.json is publicly readable ($res), so .htaccess is not in effect"; fail=1
          else
            echo "ok    /.ftp-deploy-sync-state.json blocked ($res)"
          fi

          res=$(get /this-page-does-not-exist/ /tmp/file)
          [ "${res%% *}" = 404 ] && echo "ok    unknown path returns 404" || { echo "::error::unknown path returned $res, expected 404"; fail=1; }

          exit $fail
